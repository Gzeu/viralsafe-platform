name: ViralSafe Uptime Monitor

on:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 minutes (reduced frequency)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/uptime-monitor.yml']

# Fix for "Resource not accessible by integration" error
permissions:
  issues: write
  contents: read

env:
  TIMEZONE: 'Europe/Bucharest'

jobs:
  uptime-check:
    runs-on: ubuntu-latest
    name: Check ViralSafe Production
    
    steps:
      - name: Check Vercel Frontend
        id: vercel-frontend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://viralsafe-platform-deploy-git-main-gzeus-projects.vercel.app/ || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "✅ ViralSafe Production: Online (Status: $STATUS)"
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "❌ ViralSafe Production: Offline (Status: $STATUS)"
            exit 1
          fi
          
      - name: Create Issue on Production Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 ViralSafe Production Alert - ${new Date().toISOString().split('T')[0]}`;
            const timestamp = new Date().toLocaleString('ro-RO', { timeZone: 'Europe/Bucharest' });
            
            let body = `# ViralSafe Production Alert\n\n`;
            body += `**Alert Time**: ${timestamp} (Bucharest Time)\n\n`;
            body += `## Production Service Down\n\n`;
            body += `❌ **Vercel Frontend**: OFFLINE\n`;
            body += `- URL: https://viralsafe-platform-deploy-git-main-gzeus-projects.vercel.app/\n\n`;
            body += `## Actions Required\n\n`;
            body += `1. Check Vercel dashboard for deployment issues\n`;
            body += `2. Review recent commits for breaking changes\n`;
            body += `3. Check build logs and deployment status\n\n`;
            body += `*This alert was generated automatically.*`;
            
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'production-alert'
            });
            
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['production-alert', 'critical']
              });
            }
            
      - name: Close Issues on Recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'production-alert'
            });
            
            for (const issue of issues.data) {
              const timestamp = new Date().toLocaleString('ro-RO', { timeZone: 'Europe/Bucharest' });
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ **Production Restored** - ${timestamp}\n\nViralSafe production is operational.`
              });
              
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }